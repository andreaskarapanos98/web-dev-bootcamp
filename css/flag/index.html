<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>

    /*Red Rectangle*/
    .flag {
      background-color: #ce1126;
      position: relative;
      height:600px;
      width: 900px;
    }

    /*Blue Rectangle*/
    .flag > div {
      background-color: #002868;
      position: absolute;
      height: 300px;
      width:100%;
      top: 150px;
    }

    /*White Circle*/
    .flag >div > div {
      position: relative;
      border-radius: 50%;
      height: 200px;
      width: 200px;
      left: 350px;
      top: 50px;
      background-color: white;
    }

    p {
      margin: 0;
      font-size: 5rem;
      text-align: center;
      color: white;
    }

    /*Of Laos Text*/
    div > div > div > p {
      color: black;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
