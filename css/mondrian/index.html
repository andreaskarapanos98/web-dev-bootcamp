<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* Palette: gap #000, white #F0F1EC, red #E72F24, black #232629, blue #004592, yellow #F9D01E */
    body {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .container{
      height:748;
      width: 748;
      background-color: black;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 140px 155px 20px;
      gap: 9px;
    }

    .red{
      background-color: #E72F24;
    }

    .blue{
      background-color: #004592;
      border-bottom: 10px solid black;
    }

    .yellow {
      background-color: #F9D01E;
    }

    .black {
      background-color: #232629(61, 55, 55);
    }

    .white {
      background-color: #F0F1EC;
    }

    .white1 {
      grid-column: span 3;
    }

    .white2{
      grid-row:span 2;
    }

    .white3 {
      grid-column: span 2;
      grid-row: span 2;
    }

    .white4 {
      grid-row: span 2;
    }

  </style>
</head>

<body>
   <div class="container">
    <div class="item red"></div>
    <div class="item white white1"></div>
    <div class="item white white2"></div>
    <div class="item white white3"></div>
    <div class="item blue"></div>
    <div class="item white white4"></div>
    <div class="item white white5"></div>
    <div class="item yellow"></div>
    <div class="item black"></div>
   </div>
</body>

</html>
